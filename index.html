<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Pacifico', cursive;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(270deg, #ff758c, #ff7eb3, #ff4e50);
  background-size: 600% 600%;
  animation: gradientBG 10s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  color: white;
  position: relative;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

h1 {
  font-size: 3rem;
  text-shadow: 0 0 20px #fff;
}

p {
  font-size: 1.5rem;
  margin: 20px 0;
  min-height: 40px;
}

.btn-container {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

button {
  padding: 15px 35px;
  border-radius: 50px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
  border: none;
}

#yes {
  background: white;
  color: #ff4e50;
}

#yes:hover {
  transform: scale(1.2);
  background: #ff004c;
  color: white;
}

#no {
  background: transparent;
  border: 2px solid white;
  color: white;
}

/* Popup */
.popup {
  position: fixed;
  background: white;
  color: #ff4e50;
  padding: 30px;
  border-radius: 20px;
  display: none;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
  max-width: 500px;
  text-align: center;
}

/* Image styling (HD effect look) */
.popup img {
  width: 100%;
  max-width: 400px;
  border-radius: 15px;
  margin-top: 15px;
  box-shadow: 0 0 25px rgba(255, 78, 80, 0.6);
  image-rendering: auto;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<h1>Will You Be My Valentine? 💖</h1>
<p id="text"></p>

<div class="btn-container">
  <button id="yes" onclick="openPopup()">Yes 💕</button>
  <button id="no" onmouseover="moveNo()">No 😜</button>
</div>

<div class="popup" id="popup">
  <h2>Happy Valentine’s Day ❤️</h2>
  <p>
    Thank you for saying yes…  
    This moment means more to me than words can explain.  
    I’m really lucky to have you. 💕
  </p>

  <!-- Your Image -->
  <img src="happy_valentine.png" alt="Happy Valentine Image">
</div>

<script>
const message = "You are the most special person in my life 💕";
let i = 0;

function typeEffect() {
  if (i < message.length) {
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeEffect, 80);
  }
}
typeEffect();

let moved = false;

function moveNo() {
  const btn = document.getElementById("no");

  if (!moved) {
    btn.style.position = "absolute";
    moved = true;
  }

  const maxX = window.innerWidth - btn.offsetWidth;
  const maxY = window.innerHeight - btn.offsetHeight;

  btn.style.left = Math.random() * maxX + "px";
  btn.style.top = Math.random() * maxY + "px";
}

function openPopup() {
  document.getElementById("popup").style.display = "block";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 300);
</script>

</body>
</html>
